[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiaforge-core"
version = "0.3.0"
description = "Evidence-first engineering with checksum-locked staging and fail-closed container verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "GaiaLab"}]
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
gaiaforge = "gaiaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
